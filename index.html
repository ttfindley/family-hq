<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Findley Family HQ</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet"/>
<style>
:root {
  --green: #2d6a4f;
  --green-light: #d8f3dc;
  --green-mid: #74c69d;
  --purple: #6c4f9e;
  --purple-light: #ede7f6;
  --amber: #d97706;
  --amber-light: #fef3c7;
  --coral: #c0392b;
  --coral-light: #fdecea;
  --gray-50: #f9f9f7;
  --gray-100: #f0efe9;
  --gray-200: #e2e1d8;
  --gray-400: #a8a79e;
  --gray-600: #6b6a63;
  --gray-800: #2c2b27;
  --text: #1a1917;
  --bg: #f7f6f1;
  --card: #ffffff;
  --radius: 14px;
  --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 4px 16px rgba(0,0,0,0.04);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'DM Sans', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  font-size: 15px;
  line-height: 1.5;
}

/* ── Header ── */
.site-header {
  background: var(--green);
  color: #fff;
  padding: 1.25rem 2rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 100;
}
.site-header h1 {
  font-family: 'Playfair Display', serif;
  font-size: 1.4rem;
  font-weight: 500;
  letter-spacing: -0.01em;
}
.site-header .subtitle {
  font-size: 12px;
  opacity: 0.7;
  margin-top: 1px;
}
.header-date {
  font-size: 13px;
  opacity: 0.75;
  text-align: right;
}

/* ── Stats bar ── */
.stats-bar {
  background: var(--green);
  padding: 0 2rem 1.25rem;
  display: flex;
  gap: 1rem;
}
.stat-chip {
  background: rgba(255,255,255,0.15);
  border-radius: 40px;
  padding: 6px 16px;
  font-size: 13px;
  color: #fff;
  display: flex;
  align-items: center;
  gap: 6px;
}
.stat-chip strong { font-weight: 600; }

/* ── Nav tabs ── */
.tab-nav {
  display: flex;
  gap: 0;
  background: var(--card);
  border-bottom: 1px solid var(--gray-200);
  padding: 0 2rem;
  overflow-x: auto;
}
.tab-btn {
  background: none;
  border: none;
  border-bottom: 2px solid transparent;
  padding: 0.9rem 1.25rem;
  font-family: 'DM Sans', sans-serif;
  font-size: 13px;
  font-weight: 500;
  color: var(--gray-600);
  cursor: pointer;
  white-space: nowrap;
  transition: color 0.15s, border-color 0.15s;
  display: flex;
  align-items: center;
  gap: 6px;
}
.tab-btn:hover { color: var(--text); }
.tab-btn.active { color: var(--green); border-bottom-color: var(--green); }
.tab-btn .tab-count {
  background: var(--gray-100);
  border-radius: 20px;
  padding: 1px 7px;
  font-size: 11px;
  color: var(--gray-600);
}
.tab-btn.active .tab-count { background: var(--green-light); color: var(--green); }

/* ── Main layout ── */
.main { padding: 1.5rem 2rem 3rem; max-width: 1100px; margin: 0 auto; }

/* ── Panels ── */
.panel { display: none; }
.panel.active { display: block; }

/* ── Cards ── */
.card {
  background: var(--card);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  border: 1px solid var(--gray-200);
  margin-bottom: 1rem;
}
.card-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 1rem 1.25rem 0.75rem;
  border-bottom: 1px solid var(--gray-100);
}
.card-title {
  font-size: 13px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.07em;
  color: var(--gray-600);
}
.card-body { padding: 0.5rem 0; }

.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
.three-col { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1rem; }
@media (max-width: 700px) {
  .two-col, .three-col { grid-template-columns: 1fr; }
  .main { padding: 1rem; }
  .tab-nav { padding: 0 1rem; }
  .site-header { padding: 1rem; }
  .stats-bar { padding: 0 1rem 1rem; flex-wrap: wrap; }
}

/* ── Task rows ── */
.task-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 1.25rem;
  border-bottom: 1px solid var(--gray-100);
  transition: background 0.1s;
}
.task-row:last-child { border-bottom: none; }
.task-row:hover { background: var(--gray-50); }
.task-row input[type=checkbox] { width: 17px; height: 17px; accent-color: var(--green); cursor: pointer; flex-shrink: 0; }
.task-label { flex: 1; font-size: 14px; }
.task-row.done .task-label { text-decoration: line-through; color: var(--gray-400); }
.owner-pill {
  font-size: 11px;
  font-weight: 600;
  padding: 3px 10px;
  border-radius: 20px;
  flex-shrink: 0;
  letter-spacing: 0.03em;
}
.owner-me { background: var(--green-light); color: var(--green); }
.owner-her { background: var(--purple-light); color: var(--purple); }
.owner-both { background: var(--gray-100); color: var(--gray-600); }
.delete-btn {
  background: none; border: none; cursor: pointer;
  color: var(--gray-400); font-size: 16px; padding: 2px 4px;
  border-radius: 4px; opacity: 0; transition: opacity 0.15s;
  line-height: 1;
}
.task-row:hover .delete-btn { opacity: 1; }
.delete-btn:hover { color: var(--coral); background: var(--coral-light); }

/* ── Add row ── */
.add-row {
  display: flex;
  gap: 8px;
  padding: 0.75rem 1.25rem;
  border-top: 1px solid var(--gray-100);
  align-items: center;
  flex-wrap: wrap;
}
.add-row input, .add-row select {
  font-family: 'DM Sans', sans-serif;
  font-size: 13px;
  padding: 7px 12px;
  border: 1px solid var(--gray-200);
  border-radius: 8px;
  background: var(--gray-50);
  color: var(--text);
  outline: none;
  transition: border-color 0.15s;
}
.add-row input:focus, .add-row select:focus { border-color: var(--green); }
.add-row input.flex1 { flex: 1; min-width: 140px; }
.btn-add {
  font-family: 'DM Sans', sans-serif;
  font-size: 13px;
  font-weight: 500;
  padding: 7px 16px;
  border-radius: 8px;
  border: none;
  background: var(--green);
  color: #fff;
  cursor: pointer;
  transition: background 0.15s;
  white-space: nowrap;
}
.btn-add:hover { background: #245c3f; }

/* ── Calendar events ── */
.event-row {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 9px 1.25rem;
  border-bottom: 1px solid var(--gray-100);
}
.event-row:last-child { border-bottom: none; }
.event-row:hover { background: var(--gray-50); }
.event-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; margin-top: 5px; }
.dot-green { background: var(--green-mid); }
.dot-purple { background: #9c7dcc; }
.dot-amber { background: var(--amber); }
.dot-coral { background: var(--coral); }
.dot-blue { background: #3b82f6; }
.event-text { flex: 1; font-size: 14px; }
.event-date { font-size: 12px; color: var(--gray-400); margin-top: 2px; }
.event-who { font-size: 11px; font-weight: 600; margin-top: 2px; }

/* ── Meals ── */
.meal-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 9px 1.25rem;
  border-bottom: 1px solid var(--gray-100);
}
.meal-row:last-child { border-bottom: none; }
.meal-day { width: 36px; font-size: 12px; font-weight: 600; color: var(--gray-400); flex-shrink: 0; }
.meal-name { flex: 1; font-size: 14px; }
.meal-name[contenteditable=true] {
  outline: none; border-bottom: 1px dashed var(--gray-200);
  padding-bottom: 1px; cursor: text;
}
.meal-name[contenteditable=true]:focus { border-bottom-color: var(--green); }

/* ── Groceries ── */
.grocery-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 1.25rem;
  border-bottom: 1px solid var(--gray-100);
}
.grocery-row:last-child { border-bottom: none; }
.grocery-row:hover { background: var(--gray-50); }
.grocery-row input[type=checkbox] { width: 17px; height: 17px; accent-color: var(--green); cursor: pointer; flex-shrink: 0; }
.grocery-label { flex: 1; font-size: 14px; }
.grocery-row.got .grocery-label { text-decoration: line-through; color: var(--gray-400); }
.grocery-cat { font-size: 11px; font-weight: 600; padding: 2px 9px; border-radius: 20px; background: var(--gray-100); color: var(--gray-600); }

/* ── Kids section ── */
.kid-header {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0.75rem 1.25rem;
  border-bottom: 1px solid var(--gray-100);
}
.kid-avatar {
  width: 32px; height: 32px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; font-weight: 600;
}
.avatar-q { background: var(--purple-light); color: var(--purple); }
.avatar-j { background: var(--amber-light); color: var(--amber); }
.kid-name { font-size: 14px; font-weight: 600; }
.kid-age { font-size: 12px; color: var(--gray-400); margin-top: 1px; }

.kid-note {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 7px 1.25rem 7px 1.5rem;
  border-bottom: 1px solid var(--gray-100);
  font-size: 13px;
}
.kid-note:last-child { border-bottom: none; }
.kid-note-icon { font-size: 15px; flex-shrink: 0; margin-top: 1px; color: var(--gray-400); }
.kid-note-text { flex: 1; }
.kid-note:hover { background: var(--gray-50); }
.kid-note:hover .delete-btn { opacity: 1; }

/* ── Section headings in overview ── */
.overview-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
@media (max-width: 700px) { .overview-grid { grid-template-columns: 1fr; } }

/* ── Empty state ── */
.empty {
  padding: 2rem 1.25rem;
  text-align: center;
  font-size: 13px;
  color: var(--gray-400);
}

/* ── Section label ── */
.section-label {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.09em;
  color: var(--gray-400);
  padding: 1rem 1.25rem 0.4rem;
}
</style>
</head>
<body>

<header class="site-header">
  <div>
    <h1>Findley Family HQ</h1>
    <div class="subtitle">Household command center</div>
  </div>
  <div class="header-date" id="header-date"></div>
</header>

<div class="stats-bar">
  <div class="stat-chip">✓ <strong id="stat-done">0</strong> done today</div>
  <div class="stat-chip">○ <strong id="stat-left">0</strong> remaining</div>
  <div class="stat-chip">📅 <strong id="stat-events">0</strong> upcoming</div>
  <div class="stat-chip">🛒 <strong id="stat-grocery">0</strong> to grab</div>
</div>

<nav class="tab-nav">
  <button class="tab-btn active" onclick="showTab('tasks', this)">
    ✓ Chores &amp; Tasks <span class="tab-count" id="cnt-tasks">0</span>
  </button>
  <button class="tab-btn" onclick="showTab('calendar', this)">
    📅 Calendar <span class="tab-count" id="cnt-events">0</span>
  </button>
  <button class="tab-btn" onclick="showTab('meals', this)">
    🍽 Meals &amp; Groceries
  </button>
  <button class="tab-btn" onclick="showTab('kids', this)">
    ⭐ Kids
  </button>
</nav>

<main class="main">

  <!-- TASKS PANEL -->
  <div class="panel active" id="panel-tasks">
    <div class="two-col">
      <div>
        <div class="section-label">My tasks (Travis)</div>
        <div class="card">
          <div class="card-body" id="tasks-me"></div>
          <div class="add-row">
            <input type="text" class="flex1" id="new-task-me" placeholder="Add a task for me..."/>
            <button class="btn-add" onclick="addTask('me')">Add</button>
          </div>
        </div>
      </div>
      <div>
        <div class="section-label">Shared tasks</div>
        <div class="card">
          <div class="card-body" id="tasks-both"></div>
          <div class="add-row">
            <input type="text" class="flex1" id="new-task-both" placeholder="Add a shared task..."/>
            <button class="btn-add" onclick="addTask('both')">Add</button>
          </div>
        </div>
      </div>
    </div>
    <div class="section-label" style="margin-top:.5rem">Her tasks</div>
    <div class="card">
      <div class="card-body" id="tasks-her"></div>
      <div class="add-row">
        <input type="text" class="flex1" id="new-task-her" placeholder="Add a task for her..."/>
        <button class="btn-add" onclick="addTask('her')">Add</button>
      </div>
    </div>
  </div>

  <!-- CALENDAR PANEL -->
  <div class="panel" id="panel-calendar">
    <div class="card">
      <div class="card-body" id="event-list"></div>
      <div class="add-row">
        <input type="text" class="flex1" id="new-event" placeholder="Event name..."/>
        <input type="text" id="new-event-date" placeholder="Date (e.g. May 10)" style="width:140px"/>
        <select id="new-event-who">
          <option value="Family">Family</option>
          <option value="Travis">Travis</option>
          <option value="Wife">Wife</option>
          <option value="Quinn">Quinn</option>
          <option value="Jack">Jack</option>
        </select>
        <button class="btn-add" onclick="addEvent()">Add</button>
      </div>
    </div>
  </div>

  <!-- MEALS & GROCERIES PANEL -->
  <div class="panel" id="panel-meals">
    <div class="two-col">
      <div>
        <div class="section-label">Meal plan — click to edit</div>
        <div class="card">
          <div class="card-body" id="meal-list"></div>
        </div>
      </div>
      <div>
        <div class="section-label">Grocery list</div>
        <div class="card">
          <div class="card-body" id="grocery-list"></div>
          <div class="add-row">
            <input type="text" class="flex1" id="new-grocery" placeholder="Add item..."/>
            <select id="new-grocery-cat">
              <option>Produce</option>
              <option>Protein</option>
              <option>Dairy</option>
              <option>Pantry</option>
              <option>Baby</option>
              <option>Other</option>
            </select>
            <button class="btn-add" onclick="addGrocery()">Add</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- KIDS PANEL -->
  <div class="panel" id="panel-kids">
    <div class="two-col">
      <!-- Quinn -->
      <div>
        <div class="section-label">Quinn</div>
        <div class="card">
          <div class="card-body" id="quinn-list"></div>
          <div class="add-row">
            <input type="text" class="flex1" id="new-quinn" placeholder="Note or milestone..."/>
            <button class="btn-add" onclick="addKidNote('quinn')">Add</button>
          </div>
        </div>
      </div>
      <!-- Jack -->
      <div>
        <div class="section-label">Jack</div>
        <div class="card">
          <div class="card-body" id="jack-list"></div>
          <div class="add-row">
            <input type="text" class="flex1" id="new-jack" placeholder="Note or milestone..."/>
            <button class="btn-add" onclick="addKidNote('jack')">Add</button>
          </div>
        </div>
      </div>
    </div>
  </div>

</main>

<script>
// ── State ──
const S = {
  tasks: [
    {id:1, text:'Wash & fold laundry', owner:'me', done:false},
    {id:2, text:'Vacuum downstairs', owner:'me', done:false},
    {id:3, text:'Pay electric bill', owner:'me', done:false},
    {id:4, text:'Drop off dry cleaning', owner:'me', done:false},
    {id:5, text:'Empty dishwasher', owner:'both', done:false},
    {id:6, text:'Wipe down bathrooms', owner:'both', done:false},
    {id:7, text:'Schedule pediatrician', owner:'her', done:false},
    {id:8, text:'Restock diaper bag', owner:'her', done:false},
  ],
  events: [
    {id:1, text:"Quinn's 9-month checkup", date:'May 9', who:'Quinn', color:'dot-purple'},
    {id:2, text:'Grocery run', date:'May 8', who:'Family', color:'dot-green'},
    {id:3, text:'Travis jiu-jitsu', date:'May 7', who:'Travis', color:'dot-amber'},
    {id:4, text:'Family brunch', date:'May 11', who:'Family', color:'dot-coral'},
    {id:5, text:'Car oil change', date:'May 13', who:'Travis', color:'dot-blue'},
  ],
  meals: [
    {day:'Mon', name:'Chicken stir fry'},
    {day:'Tue', name:'Tacos'},
    {day:'Wed', name:'Pasta & salad'},
    {day:'Thu', name:'Sheet pan salmon'},
    {day:'Fri', name:'Takeout 🎉'},
    {day:'Sat', name:'Grilled burgers'},
    {day:'Sun', name:'Slow cooker chili'},
  ],
  groceries: [
    {id:1, text:'Chicken breast', cat:'Protein', got:false},
    {id:2, text:'Ground beef', cat:'Protein', got:false},
    {id:3, text:'Baby formula', cat:'Baby', got:false},
    {id:4, text:'Diapers size 3 (Quinn)', cat:'Baby', got:false},
    {id:5, text:'Newborn diapers (Jack)', cat:'Baby', got:false},
    {id:6, text:'Pasta', cat:'Pantry', got:false},
    {id:7, text:'Olive oil', cat:'Pantry', got:true},
  ],
  quinn: [
    {id:1, text:'9-month checkup May 9', icon:'🩺'},
    {id:2, text:'Starting solids — sweet potato', icon:'🥔'},
    {id:3, text:'Daycare Tue & Thu, 8am–4pm', icon:'🏠'},
    {id:4, text:'Nap schedule: 10am & 2pm', icon:'😴'},
    {id:5, text:'Pediatrician: Dr. Smith (856-555-0110)', icon:'📞'},
  ],
  jack: [
    {id:1, text:'Newborn — handle with care 😄', icon:'⭐'},
    {id:2, text:'Feeding schedule: every 2–3 hrs', icon:'🍼'},
    {id:3, text:'Pediatrician: Dr. Smith (856-555-0110)', icon:'📞'},
    {id:4, text:"Next checkup: TBD", icon:'🩺'},
  ],
};

function save() {
  try { localStorage.setItem('findley-hq', JSON.stringify(S)); } catch(e) {}
}
function load() {
  try {
    const d = localStorage.getItem('findley-hq');
    if (d) { const p = JSON.parse(d); Object.assign(S, p); }
  } catch(e) {}
}

// ── Tabs ──
function showTab(id, btn) {
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('panel-' + id).classList.add('active');
  btn.classList.add('active');
}

// ── Render Tasks ──
function renderTasks() {
  const owners = ['me','both','her'];
  const ids = ['tasks-me','tasks-both','tasks-her'];
  owners.forEach((o, i) => {
    const list = S.tasks.filter(t => t.owner === o);
    const el = document.getElementById(ids[i]);
    if (list.length === 0) {
      el.innerHTML = '<div class="empty">No tasks — nice! ✓</div>';
    } else {
      el.innerHTML = list.map(t => `
        <div class="task-row ${t.done ? 'done' : ''}" id="tr-${t.id}">
          <input type="checkbox" ${t.done ? 'checked' : ''} onchange="toggleTask(${t.id})" aria-label="${t.text}"/>
          <span class="task-label">${t.text}</span>
          <button class="delete-btn" onclick="deleteTask(${t.id})" aria-label="Delete">✕</button>
        </div>`).join('');
    }
  });
  updateStats();
}

function toggleTask(id) {
  const t = S.tasks.find(x => x.id === id);
  if (t) { t.done = !t.done; save(); renderTasks(); }
}
function deleteTask(id) {
  S.tasks = S.tasks.filter(x => x.id !== id);
  save(); renderTasks();
}
function addTask(owner) {
  const ids = {me:'new-task-me', both:'new-task-both', her:'new-task-her'};
  const inp = document.getElementById(ids[owner]);
  const v = inp.value.trim();
  if (!v) return;
  S.tasks.push({id: Date.now(), text: v, owner, done: false});
  inp.value = '';
  save(); renderTasks();
}

// ── Render Events ──
const dotColors = ['dot-green','dot-purple','dot-amber','dot-coral','dot-blue'];
function renderEvents() {
  const el = document.getElementById('event-list');
  if (S.events.length === 0) {
    el.innerHTML = '<div class="empty">No upcoming events</div>';
  } else {
    el.innerHTML = S.events.map(e => `
      <div class="event-row">
        <div class="event-dot ${e.color}"></div>
        <div class="event-text">
          ${e.text}
          <div class="event-date">${e.date}</div>
          <div class="event-who" style="color:var(--gray-400)">${e.who}</div>
        </div>
        <button class="delete-btn" onclick="deleteEvent(${e.id})" aria-label="Delete">✕</button>
      </div>`).join('');
  }
  document.getElementById('cnt-events').textContent = S.events.length;
  document.getElementById('stat-events').textContent = S.events.length;
}
function deleteEvent(id) {
  S.events = S.events.filter(x => x.id !== id);
  save(); renderEvents();
}
function addEvent() {
  const v = document.getElementById('new-event').value.trim();
  const d = document.getElementById('new-event-date').value.trim() || 'TBD';
  const w = document.getElementById('new-event-who').value;
  if (!v) return;
  S.events.push({id: Date.now(), text: v, date: d, who: w, color: dotColors[S.events.length % 5]});
  document.getElementById('new-event').value = '';
  document.getElementById('new-event-date').value = '';
  save(); renderEvents();
}

// ── Render Meals ──
function renderMeals() {
  const el = document.getElementById('meal-list');
  el.innerHTML = S.meals.map((m, i) => `
    <div class="meal-row">
      <span class="meal-day">${m.day}</span>
      <span class="meal-name" contenteditable="true" onblur="updateMeal(${i}, this.textContent.trim())" spellcheck="false">${m.name}</span>
    </div>`).join('');
}
function updateMeal(i, val) {
  if (val) S.meals[i].name = val;
  save();
}

// ── Render Groceries ──
function renderGroceries() {
  const el = document.getElementById('grocery-list');
  if (S.groceries.length === 0) {
    el.innerHTML = '<div class="empty">List is empty</div>';
  } else {
    el.innerHTML = S.groceries.map(g => `
      <div class="grocery-row ${g.got ? 'got' : ''}">
        <input type="checkbox" ${g.got ? 'checked' : ''} onchange="toggleGrocery(${g.id})" aria-label="${g.text}"/>
        <span class="grocery-label">${g.text}</span>
        <span class="grocery-cat">${g.cat}</span>
        <button class="delete-btn" onclick="deleteGrocery(${g.id})" aria-label="Delete">✕</button>
      </div>`).join('');
  }
  const left = S.groceries.filter(g => !g.got).length;
  document.getElementById('stat-grocery').textContent = left;
}
function toggleGrocery(id) {
  const g = S.groceries.find(x => x.id === id);
  if (g) { g.got = !g.got; save(); renderGroceries(); }
}
function deleteGrocery(id) {
  S.groceries = S.groceries.filter(x => x.id !== id);
  save(); renderGroceries();
}
function addGrocery() {
  const v = document.getElementById('new-grocery').value.trim();
  const c = document.getElementById('new-grocery-cat').value;
  if (!v) return;
  S.groceries.push({id: Date.now(), text: v, cat: c, got: false});
  document.getElementById('new-grocery').value = '';
  save(); renderGroceries();
}

// ── Render Kids ──
function renderKid(key, elId) {
  const el = document.getElementById(elId);
  const list = S[key];
  if (list.length === 0) {
    el.innerHTML = '<div class="empty">Add a note</div>';
  } else {
    el.innerHTML = list.map(n => `
      <div class="kid-note">
        <span class="kid-note-icon">${n.icon}</span>
        <span class="kid-note-text">${n.text}</span>
        <button class="delete-btn" onclick="deleteKidNote('${key}', ${n.id})" aria-label="Delete">✕</button>
      </div>`).join('');
  }
}
function deleteKidNote(key, id) {
  S[key] = S[key].filter(x => x.id !== id);
  save(); renderKid(key, key + '-list');
}
function addKidNote(key) {
  const inpId = 'new-' + key;
  const v = document.getElementById(inpId).value.trim();
  if (!v) return;
  S[key].push({id: Date.now(), text: v, icon: '📌'});
  document.getElementById(inpId).value = '';
  save(); renderKid(key, key + '-list');
}

// ── Stats ──
function updateStats() {
  const done = S.tasks.filter(t => t.done).length;
  const left = S.tasks.filter(t => !t.done).length;
  document.getElementById('stat-done').textContent = done;
  document.getElementById('stat-left').textContent = left;
  const cntTasks = S.tasks.filter(t => !t.done).length;
  document.getElementById('cnt-tasks').textContent = cntTasks;
}

// ── Date header ──
document.getElementById('header-date').innerHTML =
  new Date().toLocaleDateString('en-US', {weekday:'long', month:'long', day:'numeric'}) +
  '<br/>' + new Date().getFullYear();

// ── Enter key support ──
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const t = e.target;
  if (t.id === 'new-task-me') addTask('me');
  else if (t.id === 'new-task-both') addTask('both');
  else if (t.id === 'new-task-her') addTask('her');
  else if (t.id === 'new-event' || t.id === 'new-event-date') addEvent();
  else if (t.id === 'new-grocery') addGrocery();
  else if (t.id === 'new-quinn') addKidNote('quinn');
  else if (t.id === 'new-jack') addKidNote('jack');
});

// ── Init ──
load();
renderTasks();
renderEvents();
renderMeals();
renderGroceries();
renderKid('quinn', 'quinn-list');
renderKid('jack', 'jack-list');
</script>
</body>
</html>
