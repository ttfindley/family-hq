<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Findley Family HQ</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet"/>
<style>
:root {
  --green: #2d6a4f;
  --green-light: #d8f3dc;
  --green-mid: #74c69d;
  --purple: #6c4f9e;
  --purple-light: #ede7f6;
  --amber: #d97706;
  --amber-light: #fef3c7;
  --coral: #c0392b;
  --coral-light: #fdecea;
  --gray-50: #f9f9f7;
  --gray-100: #f0efe9;
  --gray-200: #e2e1d8;
  --gray-400: #a8a79e;
  --gray-600: #6b6a63;
  --text: #1a1917;
  --bg: #f7f6f1;
  --card: #ffffff;
  --radius: 14px;
  --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 4px 16px rgba(0,0,0,0.04);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; font-size: 15px; line-height: 1.5; }

#loading { position: fixed; inset: 0; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 999; gap: 12px; }
#loading h2 { font-family: 'Playfair Display', serif; font-size: 1.4rem; font-weight: 500; color: var(--green); }
#loading p { font-size: 13px; color: var(--gray-400); }
.spinner { width: 32px; height: 32px; border: 3px solid var(--gray-200); border-top-color: var(--green); border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.sync-dot { width: 8px; height: 8px; border-radius: 50%; background: #aaa; display: inline-block; margin-right: 5px; transition: background 0.3s; }
.sync-dot.live { background: #74c69d; }
.sync-dot.saving { background: var(--amber); }
.sync-status { font-size: 12px; color: rgba(255,255,255,0.7); display: flex; align-items: center; margin-top: 4px; }

.site-header { background: var(--green); color: #fff; padding: 1.25rem 2rem; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
.site-header h1 { font-family: 'Playfair Display', serif; font-size: 1.4rem; font-weight: 500; }
.site-header .subtitle { font-size: 12px; opacity: 0.7; margin-top: 1px; }
.header-date { font-size: 12px; opacity: 0.75; text-align: right; }

.stats-bar { background: var(--green); padding: 0 2rem 1.25rem; display: flex; gap: 1rem; flex-wrap: wrap; }
.stat-chip { background: rgba(255,255,255,0.15); border-radius: 40px; padding: 6px 16px; font-size: 13px; color: #fff; display: flex; align-items: center; gap: 6px; }
.stat-chip strong { font-weight: 600; }

.tab-nav { display: flex; background: var(--card); border-bottom: 1px solid var(--gray-200); padding: 0 2rem; overflow-x: auto; }
.tab-btn { background: none; border: none; border-bottom: 2px solid transparent; padding: 0.9rem 1.25rem; font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 500; color: var(--gray-600); cursor: pointer; white-space: nowrap; transition: color 0.15s, border-color 0.15s; display: flex; align-items: center; gap: 6px; }
.tab-btn:hover { color: var(--text); }
.tab-btn.active { color: var(--green); border-bottom-color: var(--green); }
.tab-btn .tab-count { background: var(--gray-100); border-radius: 20px; padding: 1px 7px; font-size: 11px; color: var(--gray-600); }
.tab-btn.active .tab-count { background: var(--green-light); color: var(--green); }

.main { padding: 1.5rem 2rem 3rem; max-width: 1100px; margin: 0 auto; }
.panel { display: none; }
.panel.active { display: block; }

.card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); border: 1px solid var(--gray-200); margin-bottom: 1rem; overflow: hidden; }
.card-body { padding: 0.5rem 0; }
.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }

@media (max-width: 700px) {
  .two-col { grid-template-columns: 1fr; }
  .main { padding: 1rem; }
  .tab-nav, .site-header, .stats-bar { padding-left: 1rem; padding-right: 1rem; }
  .stats-bar { padding-bottom: 1rem; }
}

.task-row { display: flex; align-items: center; gap: 10px; padding: 9px 1.25rem; border-bottom: 1px solid var(--gray-100); transition: background 0.1s; }
.task-row:last-child { border-bottom: none; }
.task-row:hover { background: var(--gray-50); }
.task-row input[type=checkbox] { width: 17px; height: 17px; accent-color: var(--green); cursor: pointer; flex-shrink: 0; }
.task-label { flex: 1; font-size: 14px; }
.task-row.done .task-label { text-decoration: line-through; color: var(--gray-400); }

.delete-btn { background: none; border: none; cursor: pointer; color: var(--gray-400); font-size: 15px; padding: 2px 5px; border-radius: 4px; opacity: 0; transition: opacity 0.15s; line-height: 1; flex-shrink: 0; }
.task-row:hover .delete-btn,
.event-row:hover .delete-btn,
.grocery-row:hover .delete-btn,
.kid-note:hover .delete-btn { opacity: 1; }
.delete-btn:hover { color: var(--coral); background: var(--coral-light); }

.add-row { display: flex; gap: 8px; padding: 0.75rem 1.25rem; border-top: 1px solid var(--gray-100); align-items: center; flex-wrap: wrap; background: var(--gray-50); }
.add-row input, .add-row select { font-family: 'DM Sans', sans-serif; font-size: 13px; padding: 7px 12px; border: 1px solid var(--gray-200); border-radius: 8px; background: #fff; color: var(--text); outline: none; transition: border-color 0.15s; }
.add-row input:focus, .add-row select:focus { border-color: var(--green); }
.add-row input.flex1 { flex: 1; min-width: 120px; }
.btn-add { font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 500; padding: 7px 16px; border-radius: 8px; border: none; background: var(--green); color: #fff; cursor: pointer; transition: background 0.15s; white-space: nowrap; }
.btn-add:hover { background: #245c3f; }

.event-row { display: flex; align-items: flex-start; gap: 12px; padding: 9px 1.25rem; border-bottom: 1px solid var(--gray-100); transition: background 0.1s; }
.event-row:last-child { border-bottom: none; }
.event-row:hover { background: var(--gray-50); }
.event-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; margin-top: 5px; }
.dot-green { background: var(--green-mid); }
.dot-purple { background: #9c7dcc; }
.dot-amber { background: var(--amber); }
.dot-coral { background: var(--coral); }
.dot-blue { background: #3b82f6; }
.event-text { flex: 1; font-size: 14px; }
.event-date { font-size: 12px; color: var(--gray-400); margin-top: 2px; }
.event-who { font-size: 11px; color: var(--gray-400); margin-top: 1px; }

.meal-row { display: flex; align-items: center; gap: 12px; padding: 9px 1.25rem; border-bottom: 1px solid var(--gray-100); }
.meal-row:last-child { border-bottom: none; }
.meal-day { width: 36px; font-size: 12px; font-weight: 600; color: var(--gray-400); flex-shrink: 0; }
.meal-name-input { flex: 1; font-size: 14px; border: none; background: transparent; font-family: 'DM Sans', sans-serif; color: var(--text); outline: none; padding: 2px 6px; border-radius: 6px; }
.meal-name-input:focus { background: var(--gray-50); }
.meal-name-input::placeholder { color: var(--gray-400); }

.grocery-row { display: flex; align-items: center; gap: 10px; padding: 9px 1.25rem; border-bottom: 1px solid var(--gray-100); transition: background 0.1s; }
.grocery-row:last-child { border-bottom: none; }
.grocery-row:hover { background: var(--gray-50); }
.grocery-row input[type=checkbox] { width: 17px; height: 17px; accent-color: var(--green); cursor: pointer; flex-shrink: 0; }
.grocery-label { flex: 1; font-size: 14px; }
.grocery-row.got .grocery-label { text-decoration: line-through; color: var(--gray-400); }
.grocery-cat { font-size: 11px; font-weight: 600; padding: 2px 9px; border-radius: 20px; background: var(--gray-100); color: var(--gray-600); flex-shrink: 0; }

.kid-note { display: flex; align-items: flex-start; gap: 10px; padding: 8px 1.25rem; border-bottom: 1px solid var(--gray-100); font-size: 13px; transition: background 0.1s; }
.kid-note:last-child { border-bottom: none; }
.kid-note:hover { background: var(--gray-50); }
.kid-note-icon { flex-shrink: 0; font-size: 15px; margin-top: 1px; }
.kid-note-text { flex: 1; }

.section-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.09em; color: var(--gray-400); padding: 1rem 0 0.4rem; }
.empty { padding: 1.5rem 1.25rem; text-align: center; font-size: 13px; color: var(--gray-400); }
</style>
</head>
<body>

<div id="loading">
  <div class="spinner"></div>
  <h2>Findley Family HQ</h2>
  <p>Connecting to database...</p>
</div>

<header class="site-header">
  <div>
    <h1>Findley Family HQ</h1>
    <div class="subtitle">Household command center</div>
  </div>
  <div>
    <div class="header-date" id="header-date"></div>
    <div class="sync-status"><span class="sync-dot" id="sync-dot"></span><span id="sync-label">Connecting...</span></div>
  </div>
</header>

<div class="stats-bar">
  <div class="stat-chip">✓ <strong id="stat-done">0</strong> done today</div>
  <div class="stat-chip">○ <strong id="stat-left">0</strong> remaining</div>
  <div class="stat-chip">📅 <strong id="stat-events">0</strong> upcoming</div>
  <div class="stat-chip">🛒 <strong id="stat-grocery">0</strong> to grab</div>
</div>

<nav class="tab-nav">
  <button class="tab-btn active" onclick="showTab('tasks',this)">✓ Chores &amp; Tasks <span class="tab-count" id="cnt-tasks">0</span></button>
  <button class="tab-btn" onclick="showTab('calendar',this)">📅 Calendar <span class="tab-count" id="cnt-events">0</span></button>
  <button class="tab-btn" onclick="showTab('meals',this)">🍽 Meals &amp; Groceries</button>
  <button class="tab-btn" onclick="showTab('kids',this)">⭐ Kids</button>
</nav>

<main class="main">

  <!-- TASKS -->
  <div class="panel active" id="panel-tasks">
    <div class="two-col">
      <div>
        <div class="section-label">Travis's tasks</div>
        <div class="card">
          <div class="card-body" id="tasks-me"></div>
          <div class="add-row">
            <input class="flex1" id="new-task-me" placeholder="Add a task for me..."/>
            <button class="btn-add" onclick="addTask('me')">Add</button>
          </div>
        </div>
      </div>
      <div>
        <div class="section-label">Shared tasks</div>
        <div class="card">
          <div class="card-body" id="tasks-both"></div>
          <div class="add-row">
            <input class="flex1" id="new-task-both" placeholder="Add a shared task..."/>
            <button class="btn-add" onclick="addTask('both')">Add</button>
          </div>
        </div>
      </div>
    </div>
    <div class="section-label" style="margin-top:.25rem">Her tasks</div>
    <div class="card">
      <div class="card-body" id="tasks-her"></div>
      <div class="add-row">
        <input class="flex1" id="new-task-her" placeholder="Add a task for her..."/>
        <button class="btn-add" onclick="addTask('her')">Add</button>
      </div>
    </div>
  </div>

  <!-- CALENDAR -->
  <div class="panel" id="panel-calendar">
    <div class="card">
      <div class="card-body" id="event-list"></div>
      <div class="add-row">
        <input class="flex1" id="new-event" placeholder="Event name..."/>
        <input id="new-event-date" placeholder="Date (e.g. May 10)" style="width:145px"/>
        <select id="new-event-who">
          <option>Family</option><option>Travis</option><option>Wife</option><option>Quinn</option><option>Jack</option>
        </select>
        <button class="btn-add" onclick="addEvent()">Add</button>
      </div>
    </div>
  </div>

  <!-- MEALS & GROCERIES -->
  <div class="panel" id="panel-meals">
    <div class="two-col">
      <div>
        <div class="section-label">Meal plan — click any meal to edit</div>
        <div class="card">
          <div class="card-body" id="meal-list"></div>
        </div>
      </div>
      <div>
        <div class="section-label">Grocery list</div>
        <div class="card">
          <div class="card-body" id="grocery-list"></div>
          <div class="add-row">
            <input class="flex1" id="new-grocery" placeholder="Add item..."/>
            <select id="new-grocery-cat">
              <option>Produce</option><option>Protein</option><option>Dairy</option><option>Pantry</option><option>Baby</option><option>Other</option>
            </select>
            <button class="btn-add" onclick="addGrocery()">Add</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- KIDS -->
  <div class="panel" id="panel-kids">
    <div class="two-col">
      <div>
        <div class="section-label">Quinn</div>
        <div class="card">
          <div class="card-body" id="quinn-list"></div>
          <div class="add-row">
            <input class="flex1" id="new-quinn" placeholder="Note or milestone..."/>
            <button class="btn-add" onclick="addKidNote('quinn')">Add</button>
          </div>
        </div>
      </div>
      <div>
        <div class="section-label">Jack</div>
        <div class="card">
          <div class="card-body" id="jack-list"></div>
          <div class="add-row">
            <input class="flex1" id="new-jack" placeholder="Note or milestone..."/>
            <button class="btn-add" onclick="addKidNote('jack')">Add</button>
          </div>
        </div>
      </div>
    </div>
  </div>

</main>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script>
firebase.initializeApp({
  apiKey: "AIzaSyBi8hpgFWkNP1ueqL1za24p4RQHPoI31js",
  authDomain: "quinnys-creations.firebaseapp.com",
  databaseURL: "https://quinnys-creations-default-rtdb.firebaseio.com",
  projectId: "quinnys-creations",
  storageBucket: "quinnys-creations.firebasestorage.app",
  messagingSenderId: "829946968313",
  appId: "1:829946968313:web:d07dc24de9da4fbd084a28"
});

const db = firebase.database();
const ROOT = 'family-hq';

const DEFAULTS = {
  tasks: {
    t1:{text:'Wash & fold laundry',owner:'me',done:false},
    t2:{text:'Vacuum downstairs',owner:'me',done:false},
    t3:{text:'Pay electric bill',owner:'me',done:false},
    t4:{text:'Drop off dry cleaning',owner:'me',done:false},
    t5:{text:'Empty dishwasher',owner:'both',done:false},
    t6:{text:'Wipe down bathrooms',owner:'both',done:false},
    t7:{text:'Schedule pediatrician',owner:'her',done:false},
    t8:{text:'Restock diaper bag',owner:'her',done:false},
  },
  events: {
    e1:{text:"Quinn's 9-month checkup",date:'May 9',who:'Quinn',color:'dot-purple'},
    e2:{text:'Grocery run',date:'May 8',who:'Family',color:'dot-green'},
    e3:{text:'Travis jiu-jitsu',date:'May 7',who:'Travis',color:'dot-amber'},
    e4:{text:'Family brunch',date:'May 11',who:'Family',color:'dot-coral'},
    e5:{text:'Car oil change',date:'May 13',who:'Travis',color:'dot-blue'},
  },
  meals: {
    Mon:{name:'Chicken stir fry'},Tue:{name:'Tacos'},Wed:{name:'Pasta & salad'},
    Thu:{name:'Sheet pan salmon'},Fri:{name:'Takeout 🎉'},Sat:{name:'Grilled burgers'},Sun:{name:'Slow cooker chili'},
  },
  groceries: {
    g1:{text:'Chicken breast',cat:'Protein',got:false},
    g2:{text:'Ground beef',cat:'Protein',got:false},
    g3:{text:'Baby formula',cat:'Baby',got:false},
    g4:{text:'Diapers size 3 (Quinn)',cat:'Baby',got:false},
    g5:{text:'Newborn diapers (Jack)',cat:'Baby',got:false},
    g6:{text:'Pasta',cat:'Pantry',got:false},
  },
  quinn: {
    q1:{text:'9-month checkup May 9',icon:'🩺'},
    q2:{text:'Starting solids — sweet potato',icon:'🥔'},
    q3:{text:'Daycare Tue & Thu, 8am–4pm',icon:'🏠'},
    q4:{text:'Nap schedule: 10am & 2pm',icon:'😴'},
    q5:{text:'Pediatrician: Dr. Smith (856-555-0110)',icon:'📞'},
  },
  jack: {
    j1:{text:'Newborn — handle with care 😄',icon:'⭐'},
    j2:{text:'Feeding schedule: every 2–3 hrs',icon:'🍼'},
    j3:{text:'Pediatrician: Dr. Smith (856-555-0110)',icon:'📞'},
    j4:{text:'Next checkup: TBD',icon:'🩺'},
  },
};

function setSyncStatus(state) {
  const dot = document.getElementById('sync-dot');
  const lbl = document.getElementById('sync-label');
  if (state==='live') { dot.className='sync-dot live'; lbl.textContent='Live — synced'; }
  else if (state==='saving') { dot.className='sync-dot saving'; lbl.textContent='Saving...'; }
  else { dot.className='sync-dot'; lbl.textContent='Offline'; }
}

function showTab(id, btn) {
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('panel-'+id).classList.add('active');
  btn.classList.add('active');
}

let _tasks={}, _events={}, _groceries={};

function updateStats() {
  const ta = Object.values(_tasks);
  document.getElementById('stat-done').textContent = ta.filter(t=>t.done).length;
  const left = ta.filter(t=>!t.done).length;
  document.getElementById('stat-left').textContent = left;
  document.getElementById('cnt-tasks').textContent = left;
  const ec = Object.keys(_events).length;
  document.getElementById('stat-events').textContent = ec;
  document.getElementById('cnt-events').textContent = ec;
  document.getElementById('stat-grocery').textContent = Object.values(_groceries).filter(g=>!g.got).length;
}

// TASKS
function renderTasks(data) {
  _tasks = data || {};
  [['me','tasks-me'],['both','tasks-both'],['her','tasks-her']].forEach(([owner,elId]) => {
    const list = Object.entries(_tasks).filter(([,t])=>t.owner===owner);
    const el = document.getElementById(elId);
    el.innerHTML = list.length ? list.map(([id,t])=>`
      <div class="task-row ${t.done?'done':''}">
        <input type="checkbox" ${t.done?'checked':''} onchange="toggleTask('${id}',${!t.done})" aria-label="${t.text}"/>
        <span class="task-label">${t.text}</span>
        <button class="delete-btn" onclick="deleteTask('${id}')" aria-label="Delete">✕</button>
      </div>`).join('') : '<div class="empty">Nothing here — nice! ✓</div>';
  });
  updateStats();
}
function toggleTask(id,val) { setSyncStatus('saving'); db.ref(`${ROOT}/tasks/${id}/done`).set(val); }
function deleteTask(id) { setSyncStatus('saving'); db.ref(`${ROOT}/tasks/${id}`).remove(); }
function addTask(owner) {
  const ids={me:'new-task-me',both:'new-task-both',her:'new-task-her'};
  const inp=document.getElementById(ids[owner]);
  const v=inp.value.trim(); if(!v)return;
  setSyncStatus('saving');
  db.ref(`${ROOT}/tasks`).push({text:v,owner,done:false,order:Date.now()});
  inp.value='';
}

// EVENTS
const dotColors=['dot-green','dot-purple','dot-amber','dot-coral','dot-blue'];
function renderEvents(data) {
  _events=data||{};
  const el=document.getElementById('event-list');
  const list=Object.entries(_events);
  el.innerHTML = list.length ? list.map(([id,e])=>`
    <div class="event-row">
      <div class="event-dot ${e.color}"></div>
      <div class="event-text">${e.text}
        <div class="event-date">${e.date}</div>
        <div class="event-who">${e.who}</div>
      </div>
      <button class="delete-btn" onclick="deleteEvent('${id}')" aria-label="Delete">✕</button>
    </div>`).join('') : '<div class="empty">No upcoming events</div>';
  updateStats();
}
function deleteEvent(id) { setSyncStatus('saving'); db.ref(`${ROOT}/events/${id}`).remove(); }
function addEvent() {
  const v=document.getElementById('new-event').value.trim();
  const d=document.getElementById('new-event-date').value.trim()||'TBD';
  const w=document.getElementById('new-event-who').value;
  if(!v)return;
  setSyncStatus('saving');
  db.ref(`${ROOT}/events`).push({text:v,date:d,who:w,color:dotColors[Object.keys(_events).length%5]});
  document.getElementById('new-event').value='';
  document.getElementById('new-event-date').value='';
}

// MEALS
const DAY_ORDER=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
function renderMeals(data) {
  const meals=data||{};
  document.getElementById('meal-list').innerHTML = DAY_ORDER.map(day=>`
    <div class="meal-row">
      <span class="meal-day">${day}</span>
      <input class="meal-name-input" type="text" value="${(meals[day]&&meals[day].name)||''}" placeholder="What's for dinner?"
        onblur="updateMeal('${day}',this.value.trim())"
        onkeydown="if(event.key==='Enter')this.blur()"/>
    </div>`).join('');
}
function updateMeal(day,val) { setSyncStatus('saving'); db.ref(`${ROOT}/meals/${day}`).set({name:val}); }

// GROCERIES
function renderGroceries(data) {
  _groceries=data||{};
  const el=document.getElementById('grocery-list');
  const list=Object.entries(_groceries);
  el.innerHTML = list.length ? list.map(([id,g])=>`
    <div class="grocery-row ${g.got?'got':''}">
      <input type="checkbox" ${g.got?'checked':''} onchange="toggleGrocery('${id}',${!g.got})" aria-label="${g.text}"/>
      <span class="grocery-label">${g.text}</span>
      <span class="grocery-cat">${g.cat}</span>
      <button class="delete-btn" onclick="deleteGrocery('${id}')" aria-label="Delete">✕</button>
    </div>`).join('') : '<div class="empty">List is empty</div>';
  updateStats();
}
function toggleGrocery(id,val) { setSyncStatus('saving'); db.ref(`${ROOT}/groceries/${id}/got`).set(val); }
function deleteGrocery(id) { setSyncStatus('saving'); db.ref(`${ROOT}/groceries/${id}`).remove(); }
function addGrocery() {
  const v=document.getElementById('new-grocery').value.trim();
  const c=document.getElementById('new-grocery-cat').value;
  if(!v)return;
  setSyncStatus('saving');
  db.ref(`${ROOT}/groceries`).push({text:v,cat:c,got:false});
  document.getElementById('new-grocery').value='';
}

// KIDS
function renderKid(data,key,elId) {
  const list=Object.entries(data||{});
  document.getElementById(elId).innerHTML = list.length ? list.map(([id,n])=>`
    <div class="kid-note">
      <span class="kid-note-icon">${n.icon||'📌'}</span>
      <span class="kid-note-text">${n.text}</span>
      <button class="delete-btn" onclick="deleteKidNote('${key}','${id}')" aria-label="Delete">✕</button>
    </div>`).join('') : '<div class="empty">Add a note or milestone</div>';
}
function deleteKidNote(key,id) { setSyncStatus('saving'); db.ref(`${ROOT}/${key}/${id}`).remove(); }
function addKidNote(key) {
  const inp=document.getElementById('new-'+key);
  const v=inp.value.trim(); if(!v)return;
  setSyncStatus('saving');
  db.ref(`${ROOT}/${key}`).push({text:v,icon:'📌'});
  inp.value='';
}

// Enter key
document.addEventListener('keydown', e => {
  if (e.key!=='Enter'||e.target.classList.contains('meal-name-input')) return;
  const id=e.target.id;
  if(id==='new-task-me') addTask('me');
  else if(id==='new-task-both') addTask('both');
  else if(id==='new-task-her') addTask('her');
  else if(id==='new-event'||id==='new-event-date') addEvent();
  else if(id==='new-grocery') addGrocery();
  else if(id==='new-quinn') addKidNote('quinn');
  else if(id==='new-jack') addKidNote('jack');
});

document.getElementById('header-date').textContent =
  new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'});

// Init
db.ref(ROOT).once('value', snap => {
  if (!snap.exists()) {
    db.ref(ROOT).set(DEFAULTS).then(startListeners);
  } else {
    startListeners();
  }
  document.getElementById('loading').style.display='none';
  setSyncStatus('live');
});

function startListeners() {
  db.ref(`${ROOT}/tasks`).on('value', s => { renderTasks(s.val()); setSyncStatus('live'); });
  db.ref(`${ROOT}/events`).on('value', s => { renderEvents(s.val()); setSyncStatus('live'); });
  db.ref(`${ROOT}/meals`).on('value', s => { renderMeals(s.val()); setSyncStatus('live'); });
  db.ref(`${ROOT}/groceries`).on('value', s => { renderGroceries(s.val()); setSyncStatus('live'); });
  db.ref(`${ROOT}/quinn`).on('value', s => { renderKid(s.val(),'quinn','quinn-list'); setSyncStatus('live'); });
  db.ref(`${ROOT}/jack`).on('value', s => { renderKid(s.val(),'jack','jack-list'); setSyncStatus('live'); });
}
</script>
